# Deploys the static game files (index.html, css, js) to Azure App Service.
# There is nothing to compile, so the build job just packages the files.
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Deploy MonsterBlaster to Azure Web App - monsterblaster-ltepepa

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Upload site files for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .   # hidden folders like .git and .github are left out automatically

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download site files from build job
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1E297BC67C1A49DC8A14B3124D739F1B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0EF3078F75E84730A2AA0702ADD3F5E6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9CE267B3A579460C94C5EA8490370609 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'monsterblaster-ltepepa'
          slot-name: 'Production'
          package: .